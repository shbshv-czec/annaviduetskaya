name: Обновление просмотров
on:
  schedule:
    - cron: '17 4 * * *'      # каждый день в 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить счётчики
        run: python3 scripts/update-views.py
      - name: Закоммитить, если изменилось
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Просмотры на YouTube: ежедневное обновление"
            git push
          else
            echo "изменений нет"
          fi
